      HOW TO ADD A PROJECT
      Copy one <li> block. Change:
        data-video  → a Vimeo / YouTube link, or a file in /videos
        data-title  → client / project name
        data-credit → your role (director, dp, aerial dp …)
        img src     → a 16:9 still in /images/stills (1280–1600px wide JPG)
        alt         → a short description of the image (good for SEO)
    -->
