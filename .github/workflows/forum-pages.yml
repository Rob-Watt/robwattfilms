# Rebuild the plain-HTML forum thread pages (forum/t/) and the forum part of
# sitemap.xml every night, then publish them. Also keeps the free Supabase
# project awake, because it reads the database once a day.
# Run it by hand: GitHub → Actions → "Forum pages" → Run workflow.

name: Forum pages

on:
  schedule:
    - cron: '17 9 * * *'   # every day at 09:17 UTC (2:17 am in Los Angeles)
  workflow_dispatch:

permissions:
  contents: write   # commit the generated pages
  pages: write      # ask GitHub Pages to rebuild

concurrency:
  group: forum-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build thread pages from the forum database
        run: node scripts/build-forum-pages.mjs

      - name: Commit and push if anything changed
        id: commit
        run: |
          git add forum/t sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update forum thread pages"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to publish
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the push on its own."
